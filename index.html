<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="가수, 곡명, 카테고리로 검색할 수 있는 베베리 노래책"
    >
    <title>베베리 노래책</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#song-results">노래 목록으로 건너뛰기</a>

    <header class="site-header">
      <div class="site-header__inner">
        <div class="brand">
          <p class="brand__eyebrow" aria-hidden="true">BEBERRY SONGBOOK</p>
          <div class="brand__title-row">
            <h1>베베리 노래책</h1>
            <p class="brand__description">가수 또는 곡명으로 검색해보세요</p>
          </div>
        </div>

        <div class="search-field">
          <label class="visually-hidden" for="song-search">가수 또는 곡명 검색</label>
          <div class="search-field__control">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="21" height="21">
              <path
                d="m21 21-4.35-4.35m2.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-width="2"
              />
            </svg>
            <input
              id="song-search"
              type="search"
              placeholder="가수 또는 곡명을 검색하세요"
              autocomplete="off"
              disabled
            >
          </div>
        </div>
      </div>
    </header>

    <main class="app-shell">
      <aside class="category-sidebar" aria-labelledby="category-heading">
        <div class="category-panel">
          <div class="category-panel__heading">
            <div>
              <p class="category-panel__eyebrow">FILTER</p>
              <h2 id="category-heading">카테고리</h2>
            </div>
            <span class="category-panel__hint">다중 선택</span>
          </div>
          <div
            id="category-buttons"
            class="category-filter__buttons"
            role="group"
            aria-labelledby="category-heading"
          >
            <button
              class="filter-chip filter-chip--favorite"
              type="button"
              data-favorites-only
              aria-pressed="false"
              disabled
            >
              <span class="filter-chip__check" aria-hidden="true">♥</span>
              <span class="filter-chip__label">즐겨찾기</span>
              <span class="filter-chip__count">0</span>
            </button>
            <button
              class="filter-chip is-selected"
              type="button"
              data-all-categories
              aria-pressed="true"
              disabled
            >
              <span class="filter-chip__check" aria-hidden="true">✓</span>
              <span class="filter-chip__label">전체</span>
              <span class="filter-chip__count">0</span>
            </button>
          </div>
        </div>
      </aside>

      <section class="results-section" aria-labelledby="result-count">
        <div class="results-toolbar">
          <div class="results-summary">
            <h2 id="result-count" aria-live="polite">노래 목록 준비 중</h2>
            <p id="active-filter-summary" aria-live="polite">
              선택된 카테고리: 전체
            </p>
          </div>
          <button id="reset-button" class="reset-button" type="button" disabled>
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
              <path
                d="M4.9 7.3A8 8 0 1 1 4 13m.9-5.7V3m0 4.3H9"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
              />
            </svg>
            전체 초기화
          </button>
        </div>

        <div id="status-panel" class="status-panel" role="status" aria-live="polite">
          <div class="loading-spinner" aria-hidden="true"></div>
          <p class="status-panel__title">노래 목록을 불러오는 중이에요…</p>
        </div>

        <div id="song-results" class="song-grid" hidden></div>
      </section>
    </main>

    <footer>
      <p>원하는 노래를 가수, 곡명 또는 카테고리로 찾아보세요.</p>
    </footer>
  </body>
</html>
